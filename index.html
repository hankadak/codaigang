<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코대장 - 코스트코 대신 장보기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans pb-24">

    <!-- Header (로고 이미지 확대 적용) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- 로고 이미지 크기 확대 ( 기존 w-12/h-12 -> w-20/h-20 로 변경 ) -->
                <img src="logo.png" alt="코대장 로고" class="w-20 h-20 object-contain rounded-2xl border border-slate-100 shadow-sm p-1 bg-white">
                <div>
                    <h1 class="font-black text-xl text-slate-900 leading-tight">코대장</h1>
                    <p class="text-xs text-blue-600 font-bold tracking-tight">코스트코 대신 장보기</p>
                    <span class="inline-block mt-1 bg-blue-50 text-blue-700 text-[10px] font-extrabold px-2 py-0.5 rounded-md border border-blue-100">
                        1톤 롱바디 직송
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

        <!-- Banner Info -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-2xl p-4 shadow-lg relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl font-black">CODAI</div>
            <div class="relative z-10">
                <div class="flex items-center space-x-2 text-xs font-semibold text-blue-200 mb-1">
                    <i class="fa-solid fa-truck-fast"></i>
                    <span>대구·거창·함양 전용 구매대행</span>
                </div>
                <h2 class="text-lg font-bold">코스트코 장보기, 집 앞에서 편하게!</h2>
                <p class="text-xs text-blue-100 mt-1 opacity-90">
                    대구지역 매일 당일배송 / 거창·함양 금요일 정기배송
                </p>
            </div>
        </div>

        <!-- Region Selector -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-sm text-slate-900 mb-3 flex items-center">
                <i class="fa-solid fa-location-dot text-blue-600 mr-2"></i>배송 지역 선택
            </h3>
            <div class="grid grid-cols-3 gap-2 text-xs">
                <label class="cursor-pointer">
                    <input type="radio" name="region" value="daegu" class="peer hidden" checked onchange="calculateTotal()">
                    <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 font-semibold transition">
                        <div>대구 전역</div>
                        <div class="text-[10px] text-slate-500 peer-checked:text-blue-600 mt-0.5">5,000원</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="region" value="geochang" class="peer hidden" onchange="calculateTotal()">
                    <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 font-semibold transition">
                        <div>거창 · 함양</div>
                        <div class="text-[10px] text-slate-500 peer-checked:text-blue-600 mt-0.5">8,000원 (금)</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="region" value="pickup" class="peer hidden" onchange="calculateTotal()">
                    <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 font-semibold transition">
                        <div>지정 픽업존</div>
                        <div class="text-[10px] text-slate-500 peer
