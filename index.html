<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코대장 - 코스트코 대신 장보기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { min-height: 100vh; overflow-y: auto !important; }
        .logo-crop { object-fit: cover; object-position: center; transform: scale(1.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans flex flex-col pb-48">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-14 h-14 rounded-2xl border border-slate-200 shadow-sm overflow-hidden bg-white flex items-center justify-center shrink-0">
                    <img src="logo.png" alt="코대장 로고" class="w-full h-full logo-crop" onerror="this.src='https://via.placeholder.com/100?text=CODAI'">
                </div>
                <div>
                    <h1 class="font-black text-xl text-slate-900 leading-tight flex items-center space-x-1">
                        <span>코대장</span>
                        <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">Costco</span>
                    </h1>
                    <p class="text-[11px] text-blue-600 font-bold tracking-tight">코스트코 구매대행 서비스</p>
                </div>
            </div>
            <a href="tel:010-0000-0000" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl transition flex items-center space-x-1">
                <i class="fa-solid fa-phone text-blue-600"></i>
                <span>문의</span>
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto px-4 pt-4 space-y-4 flex-1">

        <!-- Top Announcement Banner -->
        <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-950 text-white rounded-2xl p-4 shadow-md relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl font-black">COSTCO</div>
            <div class="relative z-10 space-y-1">
                <div class="inline-flex items-center space-x-1 bg-red-500/80 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                    <i class="fa-solid fa-fire text-amber-300"></i>
                    <span>금요일 거창·함양 정기배송</span>
                </div>
                <h2 class="text-base font-extrabold leading-snug">무거운 코스트코 장보기,<br>집 앞까지 무겁지 않게 배달해드립니다!</h2>
                <p class="text-[11px] text-blue-200 pt-0.5">대구 전역 매일 당일배송 🚚</p>
            </div>
        </div>

        <!-- Region Selector Card -->
        <section class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-xs text-slate-900 mb-2 flex items-center justify-between">
                <span><i class="fa-solid fa-location-dot text-blue-600 mr-1.5"></i>배송 지역 선택</span>
                <span class="text-[10px] text-slate-400 font-normal">지역별 배송비 차등 적용</span>
            </h3>
            <div class="grid grid-cols-3 gap-2 text-xs">
                <label class="cursor-pointer">
                    <input type="radio" name="region" value="daegu" class="peer hidden" checked onchange="calculateTotal()">
                    <div class="p-2.5 text-center rounded-xl border border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text
